name: Linux
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s linux/tests -v
      - run: bash -n install.sh bin/trackai linux/bin/trackai linux/scripts/build.sh
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 xvfb
      - run: xvfb-run -a /usr/bin/python3 linux/scripts/smoke-ui.py /tmp/trackai-preview
      - run: ./linux/scripts/build.sh
      - name: Check committed Linux payload is current
        run: git diff --exit-code -- dist/trackai-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-preview
          path: /tmp/trackai-preview/*.png
